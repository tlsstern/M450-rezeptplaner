name: Backend Tests

on:
  push:
  pull_request:

permissions:
  contents: read
  checks: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: recipe-planner-backend

    steps:
      - uses: actions/checkout@v4

      # same version as java.version from the spring boot parent in the pom
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test
        run: mvn -B verify

      - name: Test summary
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: recipe-planner-backend/target/surefire-reports/TEST-*.xml

      - name: Upload surefire report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-report
          path: |
            recipe-planner-backend/target/surefire-reports/
            recipe-planner-backend/target/site/surefire-report.html

      - name: Upload jacoco report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: recipe-planner-backend/target/site/jacoco/
